<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert PDF tables to Excel">
  <title>PDF to Excel</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="convert">Convert PDF to Excel</div>
  <span class="divisi">Product Information</span>
</header>

<main class="container">
  <section class="card">
    <div id="dropzone" class="dropzone" tabindex="0">
      <div class="upload-icon">↑</div>
      <h2>Drop or Upload PDF</h2>
      <p>or <label for="fileInput" class="browse">Browse Files</label></p>
      <small>PDF only · Maximum 20 MB</small>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
    </div>

    <div id="status" class="status hidden"></div>

    <div id="workspace" class="workspace hidden">
      <div class="filebar">
        <div>
          <strong id="fileName">file.pdf</strong>
          <span id="fileMeta"></span>
        </div>
        <button id="removeBtn" class="ghost">Hapus</button>
      </div>

      <div class="controls">
        <label>Table mode
          <select id="tableMode">
            <option value="auto">Auto detect</option>
            <option value="space">Whitespace</option>
            <option value="line">One line per row</option>
          </select>
        </label>

        <!-- <label>Column gap
          <input id="gap" type="number" min="2" max="100" value="18">
          <span class="unit">px</span>
        </label> -->

        <label>Pages
          <select id="pageMode">
            <option value="all">All pages</option>
            <option value="first">First page</option>
          </select>
        </label>

        <label>Merge cells
          <select id="mergeMode">
            <option value="auto">Auto fill</option>
            <option value="off">Off</option>
          </select>
        </label>
      </div>

      <button id="extractBtn" class="primary">Extract & Preview</button>

      <div id="previewWrap" class="preview-wrap hidden">
        <div class="preview-head">
          <div>
            <h3>Preview</h3>
            <span id="rowCount"></span>
          </div>
          <button id="downloadBtn" class="primary small">Download Excel</button>
        </div>

        <div class="table-scroll">
          <table id="previewTable"></table>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>Convert PDF to Excel Beta V1</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
